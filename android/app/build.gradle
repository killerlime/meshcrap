plugins { id 'com.android.application'; id 'com.google.protobuf' }
android {
    namespace 'org.meshcrap.survey'
    compileSdk 35
    defaultConfig { applicationId 'org.meshcrap.survey'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.2.0-test' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
dependencies { implementation 'com.google.protobuf:protobuf-javalite:4.29.3'; testImplementation 'junit:junit:4.13.2' }
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.29.3' }
    generateProtoTasks { all().each { task -> task.builtins { java { option 'lite' } } } }
}
