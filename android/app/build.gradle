plugins { id 'com.android.application'; id 'com.google.protobuf' }
android {
    namespace 'org.jkmesh.survey'
    compileSdk 35
    defaultConfig { applicationId 'org.jkmesh.survey'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0-test' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
dependencies { implementation 'com.google.protobuf:protobuf-javalite:4.29.3'; testImplementation 'junit:junit:4.13.2' }
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.29.3' }
    generateProtoTasks { all().each { task -> task.builtins { java { option 'lite' } } } }
}
