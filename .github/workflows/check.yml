name: Portable installation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python tests/smoke.py
      - run: python tests/feed_policy.py
      - run: python tests/role_comparison.py
      - run: python tests/efficiency.py
      - run: node tests/visible-poll.cjs
      - run: python tests/frontend.py
      - run: python tests/privacy_check.py
