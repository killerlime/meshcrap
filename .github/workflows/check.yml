name: Portable installation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python tests/smoke.py
      - run: python tests/feed_policy.py
      - run: python tests/role_comparison.py
      - run: python tests/efficiency.py
      - run: python tests/setup_labels.py
      - run: python tests/heywhatsthat_test.py
      - run: python tests/receiver_diagnostics_test.py
      - run: python tests/survey_phone_test.py
      - run: python tests/environment_evidence.py
      - run: python tests/tropo_evidence.py
      - run: python tests/public_weather_cache.py
      - run: node tests/visible-poll.cjs
      - run: node tests/mesh-simulator.cjs
      - run: node tests/role-model.cjs
      - run: node tests/refresh-controls.cjs
      - run: node tests/dashboard-refresh.cjs
      - run: node tests/traffic-simulation.cjs
      - run: node tests/map-report.cjs
      - run: python tests/relay_activity.py
      - run: python tests/first_heard.py
      - run: python tests/frontend.py
      - run: python tests/privacy_check.py
      - run: python tests/licenses.py
      - run: python tools/license_inventory.py dist/licenses
      - uses: actions/upload-artifact@v4
        with:
          name: python-license-inventory-${{ matrix.python }}
          path: dist/licenses
