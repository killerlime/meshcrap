name: Build VM appliances
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libguestfs-tools qemu-utils qemu-system-x86
      - run: bash deploy/vm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: meshcrap-vm-amd64
          path: dist/vm/
          retention-days: 14
          compression-level: 6
