name: Build VM appliances
on:
  workflow_dispatch:
    inputs:
      image_kind:
        description: Select the image family to validate
        type: choice
        options: [both, vm, live]
        default: both
      publish_artifacts:
        description: Upload binaries only after privacy and license review
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  live:
    if: inputs.image_kind != 'vm'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Use Debian's live-build for Debian images. Ubuntu's older fork generates
      # obsolete security-suite names for Bookworm.
      - name: Build and boot-test in disposable Debian environment
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src debian:bookworm-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates live-build debootstrap squashfs-tools xorriso isolinux syslinux-common qemu-system-x86
            bash deploy/live/build.sh
            bash deploy/live/verify.sh
          '
      - uses: actions/upload-artifact@v4
        if: inputs.publish_artifacts
        with:
          name: meshcrap-live-amd64
          path: dist/live/
          retention-days: 14
          compression-level: 0
  build:
    if: inputs.image_kind != 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libguestfs-tools qemu-utils qemu-system-x86 linux-image-generic
      # Use QEMU user networking; passt privilege dropping cannot access root-owned build sockets.
      - run: sudo apt-get remove -y passt
      - run: sudo bash deploy/vm/build.sh
      - uses: actions/upload-artifact@v4
        if: inputs.publish_artifacts
        with:
          name: meshcrap-vm-amd64
          path: dist/vm/
          retention-days: 14
          compression-level: 6
