name: CodeQL Advanced
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '36 0 * * 4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            config: .github/codeql/default.yml
          - language: java-kotlin
            build-mode: none
            config: .github/codeql/default.yml
          - language: javascript-typescript
            build-mode: none
            config: .github/codeql/javascript.yml
          - language: python
            build-mode: none
            config: .github/codeql/python.yml
          - language: swift
            build-mode: manual
            config: .github/codeql/default.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.language == 'python' || matrix.language == 'javascript-typescript'
        with:
          python-version: '3.12'
      - name: Render portable application for analysis
        if: matrix.language == 'python' || matrix.language == 'javascript-typescript'
        run: python tools/prepare_codeql.py
      - name: Install iOS project generator
        if: matrix.language == 'swift'
        run: brew install xcodegen
      - name: Generate iOS project
        if: matrix.language == 'swift'
        working-directory: ios
        run: xcodegen generate
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config }}
      - name: Compile iOS source for analysis without signing
        if: matrix.language == 'swift'
        working-directory: ios
        run: |
          xcodebuild -project Meshcrap.xcodeproj -scheme Meshcrap \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
