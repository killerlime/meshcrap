name: Publish interactive demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['demo/**', 'tools/build_demo.py', 'source/dashboard/static/vendor/**', '.github/workflows/demo.yml', 'THIRD_PARTY_NOTICES.md', 'LICENSE']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 tools/build_demo.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo
      - uses: actions/deploy-pages@v4
        id: deployment
