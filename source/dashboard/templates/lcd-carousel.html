<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receiver display</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#090f12;color:#eaf5ef}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px}header{height:48px;border-bottom:1px solid #294035}h1{font-size:19px;margin:0}button,input{font:inherit}button{min-height:42px;background:#19342a;color:#edfff4;border:1px solid #416c57;border-radius:8px;padding:5px 13px;touch-action:manipulation}button:disabled{opacity:.4}main{height:calc(100dvh - 100px);padding:10px 16px;overflow:auto}h2{font-size:18px;margin:0 0 9px;color:#8aefb3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid #294035;background:#101d18;border-radius:10px;padding:8px 12px;min-width:0}.value{font-size:clamp(21px,6vw,38px);font-weight:700;overflow-wrap:anywhere}.label,.note{font-size:12px;color:#b4cdbf}.note{margin-top:8px}.error{color:#ffc97e}footer{height:52px}#progress{font-size:13px}dialog{width:min(620px,98vw);max-height:96dvh;background:#101d18;color:#edfff4;border:1px solid #6ca582;border-radius:12px;padding:14px}dialog::backdrop{background:#000a}.editrow{display:flex;align-items:center;gap:8px;padding:5px 0}.editrow label{flex:1}.editrow input{width:24px;height:24px;vertical-align:middle}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.editrow button{padding:4px 12px}input[type=number]{width:72px;padding:6px}#fresh{font-size:11px;text-align:right}@media(max-height:350px){header{height:42px}main{height:calc(100dvh - 92px)}h2{font-size:16px;margin-bottom:5px}.tile{padding:4px 8px}.grid{gap:6px}.value{font-size:26px}.note{margin-top:4px}}
html,body,body *,dialog::backdrop{cursor:none!important}

#mapPanel[hidden]{display:none}#mapPanel{position:fixed;inset:0;z-index:3000;background:#101d18;display:flex;flex-direction:column}#mapToolbar{height:46px;display:flex;align-items:center;gap:5px;padding:2px 6px}#mapToolbar button{padding:4px 9px;min-height:40px}#lcdMap{flex:1;min-height:0;background:#263530}#mapFoot{height:44px;display:flex;align-items:center;justify-content:space-between;padding:2px 8px;gap:8px}#mapFoot button{min-height:40px;min-width:42px;padding:2px 8px}#mapStatus,#mapCount{font-size:10px}#mapPanel label{font-size:13px;white-space:nowrap}#mapPanel input{width:21px;height:21px;vertical-align:middle}.leaflet-popup-content{color:#17251d;font-size:13px}.leaflet-control-attribution{font-size:9px!important}.leaflet-popup-close-button{min-width:32px;min-height:32px}
#carouselTitle{max-width:150px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}#fresh{flex:1;min-width:0}
main,dialog{scroll-behavior:auto;overscroll-behavior:contain}main{touch-action:pan-y}
#idleSaver{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:#000;overflow:hidden;touch-action:none}#idleSaver::backdrop{background:#000}#idleLogo{position:absolute;width:280px;max-width:80vw;height:auto}#idleSaver[data-mode="sleep"] #idleLogo{display:none}
@media(max-height:350px){main{padding:6px 10px}.value{font-size:23px}.label{font-size:11px}header,footer{padding:3px 6px;gap:5px}header button{padding:3px 9px}#carouselTitle{max-width:95px;font-size:17px}.note{font-size:11px}button:focus-visible{outline:2px solid #8aefb3;outline-offset:1px}}
</style></head><body><header><h1 id="carouselTitle">Receiver</h1><span id="fresh">Connecting…</span><button id="mapOpen">Map</button><button id="refreshNow" aria-label="Refresh display data">↻</button><button id="edit">Edit</button></header><main id="screen" aria-live="polite"></main><footer><button id="prev" aria-label="Previous screen">◀</button><span id="progress"></span><button id="pause">Pause</button><button id="next" aria-label="Next screen">▶</button></footer><dialog id="editor"><h2>Edit carousel</h2><p class="note">Choose screens and use the arrows to reorder them. Saved on this display; radio settings are unchanged.</p><p><label for="carouselNode">Display node</label><select id="carouselNode" style="display:block;width:100%;min-height:44px;font:inherit;margin-top:5px"></select></p><button id="useReceiver" type="button">Use main receiver</button><div id="choices"></div><p><label>Seconds per screen <input id="duration" type="number" min="5" max="120" value="10"></label></p><p id="editerror" role="status"></p><div class="toolbar"><button id="save">Save</button><button id="cancel">Cancel</button></div></dialog><dialog id="idleSaver" aria-label="Touch to wake display"><img id="idleLogo" src="/static/lcd-screensaver.png" alt="MSPM" draggable="false"></dialog><script src="/static/lcd-idle.js?v=lcd-review-2"></script><script src="/static/lcd-carousel.js?v=lcd-review-2"></script><section id="mapPanel" hidden aria-label="Node map"><div id="mapToolbar"><button id="mapClose">Back</button><button id="mapHome">Receiver</button><button id="mapAll">Fit all</button><button id="mapRefresh">Refresh</button><label><input id="mapJk" type="checkbox">Local only</label></div><div id="lcdMap" aria-label="Map of node locations"></div><div id="mapFoot"><div><div id="mapCount"></div><div id="mapStatus" role="status"></div></div><button id="mapMinus" aria-label="Zoom out">−</button><button id="mapPlus" aria-label="Zoom in">+</button></div></section><script src="/static/lcd-map.js?v=lcd-review-2"></script></body></html>
